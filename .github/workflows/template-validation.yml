name: Template validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: template-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: template-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate template files
        run: python3 scripts/validate-template.py

      - name: Test repository validation scripts
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Require completed bootstrap after initialization starts
        run: python3 scripts/check-bootstrap.py --ci
